{% extends 'base.html' %}

{% block content %}

<div class="max-w-4xl mx-auto py-20 px-6">

    <h1 class="text-5xl font-bold mb-10">
        IA Emocional
    </h1>

    <form method="POST" class="space-y-4">

        {% csrf_token %}

        <textarea
            name="message"
            rows="5"
            placeholder="¿Cómo te sentís hoy?"
            class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl p-5"
        >{{ message }}</textarea>

        <button
            class="bg-white text-black px-6 py-3 rounded-2xl font-semibold">
            Enviar
        </button>

    </form>

    {% if response %}

        <div class="mt-10 bg-zinc-900 rounded-2xl p-6">

            <h2 class="font-bold text-xl mb-4">
                Respuesta IA
            </h2>

            <div class="text-zinc-300 whitespace-pre-line">
                {{ response }}
            </div>

        </div>

    {% endif %}

</div>

{% endblock %}
