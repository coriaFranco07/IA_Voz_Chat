{% extends 'base.html' %}

{% block content %}

<div class="max-w-3xl mx-auto py-20 px-6">

    <h1 class="text-4xl font-bold mb-10">
        IA Emocional
    </h1>

    <form method="POST" class="space-y-4">

        {% csrf_token %}

        <textarea
            name="message"
            rows="4"
            placeholder="¿Cómo te sentís?"
            class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl p-4"
        ></textarea>

        <button class="bg-white text-black px-6 py-3 rounded-xl font-semibold">
            Enviar
        </button>

    </form>

    {% if response %}

        <div class="mt-10 bg-zinc-900 p-6 rounded-2xl">

            <h2 class="font-bold mb-4">
                Respuesta IA
            </h2>

            <p class="text-zinc-300 whitespace-pre-line">
                {{ response }}
            </p>

        </div>

    {% endif %}

</div>

{% endblock %}
