{% extends 'base.html' %}

{% block title %}
Chat
{% endblock %}

{% block content %}

<div class="flex h-screen">

    <!-- SIDEBAR -->
    <aside class="w-80 bg-zinc-900 border-r border-zinc-800 flex flex-col">

        <div class="p-4 border-b border-zinc-800">
            <button class="w-full bg-white text-black py-3 rounded-xl font-semibold">
                + Nueva conversación
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-3 space-y-2">

            <div class="bg-zinc-800 p-3 rounded-xl cursor-pointer">
                Ansiedad social
            </div>

            <div class="hover:bg-zinc-800 p-3 rounded-xl cursor-pointer transition">
                Estrés laboral
            </div>

            <div class="hover:bg-zinc-800 p-3 rounded-xl cursor-pointer transition">
                Relaciones
            </div>

        </div>

    </aside>


    <!-- CHAT -->
    <main class="flex-1 flex flex-col bg-zinc-950">

        <!-- HEADER -->
        <div class="border-b border-zinc-800 p-4">
            <h1 class="font-semibold text-lg">
                IA Voz Chat
            </h1>
        </div>


        <!-- MENSAJES -->
        <div class="flex-1 overflow-y-auto p-6 space-y-6">

            <!-- IA -->
            <div class="flex">

                <div class="bg-zinc-800 p-4 rounded-2xl max-w-2xl">
                    Hola 👋
                    ¿Cómo te sentís hoy?
                </div>

            </div>


            <!-- USER -->
            <div class="flex justify-end">

                <div class="bg-white text-black p-4 rounded-2xl max-w-2xl">
                    Me siento algo ansioso.
                </div>

            </div>

        </div>


        <!-- INPUT -->
        <div class="p-4 border-t border-zinc-800">

            <form class="flex gap-3">

                <input
                    type="text"
                    placeholder="Escribí cómo te sentís..."
                    class="flex-1 bg-zinc-900 border border-zinc-700 rounded-2xl px-4 py-4 outline-none focus:border-white"
                >

                <button
                    class="bg-white text-black px-6 rounded-2xl font-semibold">
                    Enviar
                </button>

            </form>

        </div>

    </main>

</div>

{% endblock %}
